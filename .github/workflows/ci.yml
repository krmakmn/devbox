name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows asıl hedef; Linux'ta da koşuyoruz çünkü geliştirme ve
        # inceleme çoğunlukla orada oluyor ve platforma özgü kod yollarının
        # ayrışmasını erken görmek istiyoruz.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Üretilen Apache ve Nginx yapılandırmaları, gerçek sunucuların kendi
      # söz dizimi denetiminden geçiriliyor. Altın dosya testi metnin
      # beklediğimiz gibi olduğunu söyler; sunucunun onu kabul edeceğini
      # söylemez. Windows'ta bu paketler yok, testler kendiliğinden
      # atlanıyor.
      - name: Web sunucularını, PHP'yi ve veritabanlarını kur (gerçek motor testleri için)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nginx-light apache2 php-cli postgresql mariadb-server redis-server

      - name: Biçim denetimi
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt uygulanmamış dosyalar:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Testler (yarış dedektörüyle)
        # DEVBOX_TEST_TRUST_STORE burada bilerek AÇIK DEĞİL. Windows kök
        # sertifika eklerken onay penceresi gösteriyor; CI'da masaüstü
        # oturumu olmadığı için pencere gösterilemiyor ama çağrı yanıt
        # bekliyor ve iş 10 dakikalık test zaman aşımına kadar asılı
        # kalıyor. Bu yolu doğrulamak için gerçek bir Windows oturumunda
        # elle koşmak gerekiyor.
        run: go test ./... -race -count=1

  cross-build:
    name: Çapraz derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Windows hedefleri
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...

  vscode-extension:
    name: VS Code eklentisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # Eklentinin testleri gerçek bir devboxd'ye bağlanıyor; ikili
      # olmadan yalnız birim testleri koşardı.
      - name: devbox'ı derle
        run: go build -o /tmp/devbox ./cmd/devbox

      - name: Bağımlılıklar
        working-directory: editors/vscode
        run: npm ci

      - name: Derleme (tsc --strict)
        working-directory: editors/vscode
        run: npm run compile

      - name: Testler (gerçek devboxd ile)
        working-directory: editors/vscode
        env:
          DEVBOX_BIN: /tmp/devbox
        run: npm test

  acme-compat:
    name: ACME uyumluluğu (lego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Birim testleri protokolü bizim anladığımız gibi sınıyor; yanlış
      # anlaşılan bir yer varsa test de aynı yanlışı yapar. Bağımsız
      # yazılmış bir istemcinin akışı baştan sona tamamlaması, protokolü
      # gerçekten doğru uyguladığımızın kanıtı.
      - name: devbox'ı derle
        run: go build -o /tmp/devbox ./cmd/devbox

      - name: ACME sunucusunu başlat
        run: |
          DEVBOX_HOME=/tmp/acme-ci /tmp/devbox acme serve \
            -addr 127.0.0.1:14000 \
            -map api.magaza.test=127.0.0.1:15080 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:14000/acme/directory > /dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "ACME sunucusu açılmadı"; exit 1

      - name: lego ile sertifika al
        working-directory: tests/acme-client
        run: go run . http://127.0.0.1:14000/acme/directory api.magaza.test 15080

      - name: Zinciri kök sertifikayla doğrula
        run: |
          curl -sf http://127.0.0.1:14000/acme/root.crt -o /tmp/root.crt
          openssl verify -CAfile /tmp/root.crt tests/acme-client/alinan.crt
