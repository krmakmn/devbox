name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows asıl hedef; Linux'ta da koşuyoruz çünkü geliştirme ve
        # inceleme çoğunlukla orada oluyor ve platforma özgü kod yollarının
        # ayrışmasını erken görmek istiyoruz.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Biçim denetimi
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt uygulanmamış dosyalar:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Testler (yarış dedektörüyle)
        # Güven deposuna gerçekten yazan test yalnız burada açık: CI makinesi
        # kullan-at, geliştirici makinesi değil. Test kendi kökünü kurup
        # kaldırıyor.
        env:
          DEVBOX_TEST_TRUST_STORE: "1"
        run: go test ./... -race -count=1

  cross-build:
    name: Çapraz derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Windows hedefleri
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
