name: Windows duman testi

# Bu iş, deponun en uzun süre açık kalan doğrulama boşluğunu kapatmak
# için var: yığının gerçek Windows'ta hiç çalıştırılmamış olması.
#
# GitHub'ın windows-latest koşucusu gerçek bir Windows Server ve süreçler
# yükseltilmiş yönetici belirteciyle çalışıyor — yani NRPT kuralı ve
# makine geneli sertifika deposu gerçekten denenebiliyor.
#
# Kapsamadıkları tests/windows-smoke/README.md'de yazılı.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Gerçek Windows'ta uçtan uca
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Derle
        run: |
          go build -o devbox.exe ./cmd/devbox
          go build -o arka-uc.exe tests/windows-smoke/arka-uc.go
          .\devbox.exe version

      - name: Yönetici mi, göster
        shell: pwsh
        run: |
          $kimlik = [Security.Principal.WindowsIdentity]::GetCurrent()
          $rol = New-Object Security.Principal.WindowsPrincipal($kimlik)
          $yonetici = $rol.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "kullanıcı : $($kimlik.Name)"
          Write-Host "yönetici  : $yonetici"
          if (-not $yonetici) {
            Write-Host "::warning::Koşucu yönetici değil; NRPT ve makine deposu adımları atlanacak"
          }
          "ADMIN=$yonetici" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Kök sertifikayı makine deposuna kur
        shell: pwsh
        run: |
          .\devbox.exe cert issue magaza.test
          .\devbox.exe trust install -machine
          .\devbox.exe trust status

          # Bağımsız doğrulama: sertifika gerçekten Windows deposunda mı?
          $kokYolu = .\devbox.exe trust path
          $kok = New-Object Security.Cryptography.X509Certificates.X509Certificate2($kokYolu)
          Write-Host "kök parmak izi: $($kok.Thumbprint)"

          $depo = Get-ChildItem Cert:\LocalMachine\Root |
                  Where-Object { $_.Thumbprint -eq $kok.Thumbprint }
          if (-not $depo) {
            throw "Kök sertifika LocalMachine\Root deposunda bulunamadı"
          }
          Write-Host "✓ kök sertifika makine güven deposunda: $($depo.Subject)"

      # Bu adım bilerek büyük: GitHub'ın Windows koşucusunda bir adımın
      # arka planda başlattığı süreç, adım bitince ölüyor (konsol
      # kapanınca CTRL_CLOSE geliyor). İlk iki koşuda çözücü bir sonraki
      # adımda çoktan ölmüştü ve "kimse dinlemiyor" görüntüsü bundandı.
      # Çözücüyü başlatan ve sorgulayan her şey tek adımda.
      - name: Çözücü, NRPT ve alan adı çözümlemesi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- 1) Windows 127.0.0.53'e UDP teslim ediyor mu? ---
          # DevBox'tan bağımsız ölçüm: Linux'ta 127.0.0.0/8'in tamamı
          # geri döngüye bağlı, Windows'ta yalnız 127.0.0.1 atanmış
          # durumda. Çözücünün adresi bu cevaba bağlı.
          Write-Host "--- 127.0.0.53 geri döngü denemesi ---"
          $teslim = $false
          try {
            $uc = [System.Net.IPEndPoint]::new([System.Net.IPAddress]::Parse('127.0.0.53'), 15353)
            $dinleyici = [System.Net.Sockets.UdpClient]::new($uc)
            $dinleyici.Client.ReceiveTimeout = 3000
            $gonderen = [System.Net.Sockets.UdpClient]::new()
            $veri = [Text.Encoding]::ASCII.GetBytes('deneme')
            $gonderen.Send($veri, $veri.Length, '127.0.0.53', 15353) | Out-Null
            $uzak = [System.Net.IPEndPoint]::new([System.Net.IPAddress]::Any, 0)
            $alinan = $dinleyici.Receive([ref]$uzak)
            $teslim = $true
            Write-Host "✓ 127.0.0.53'e UDP teslim ediliyor ($($alinan.Length) bayt)"
          } catch {
            Write-Host "::warning::127.0.0.53'e UDP teslim EDİLMEDİ: $_"
          } finally {
            if ($dinleyici) { $dinleyici.Close() }
            if ($gonderen) { $gonderen.Close() }
          }

          # --- 2) Çözücüyü başlat (bu adımın içinde) ---
          $cozucu = Start-Process -FilePath .\devbox.exe -ArgumentList 'dns','serve' `
            -PassThru -RedirectStandardOutput dns-out.log -RedirectStandardError dns-err.log
          Write-Host "çözücü pid: $($cozucu.Id)"
          Start-Sleep -Seconds 3

          if ($cozucu.HasExited) {
            Get-Content dns-out.log, dns-err.log -ErrorAction SilentlyContinue | Write-Host
            throw "çözücü açılır açılmaz kapandı (çıkış kodu $($cozucu.ExitCode))"
          }

          Write-Host "--- çözücü günlüğü ---"
          Get-Content dns-out.log, dns-err.log -ErrorAction SilentlyContinue | Write-Host

          Write-Host "--- 53 numaralı portu dinleyenler ---"
          Get-NetUDPEndpoint -LocalPort 53 -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, OwningProcess |
            Format-Table -AutoSize | Out-String | Write-Host

          # --- 3) Çözücüye doğrudan sor ---
          $dogrudan = Resolve-DnsName -Name magaza.test -Server 127.0.0.53 -ErrorAction SilentlyContinue
          if (-not $dogrudan) {
            Write-Host "--- nslookup ile ---"
            nslookup magaza.test 127.0.0.53 2>&1 | Write-Host
            Get-Content dns-out.log, dns-err.log -ErrorAction SilentlyContinue | Write-Host
            if (-not $teslim) {
              throw "çözücü yanıt vermedi VE Windows 127.0.0.53'e teslim etmiyor: çözücü adresi bu platformda kullanılamaz"
            }
            throw "çözücü doğrudan sorulduğunda yanıt vermedi"
          }
          $dogrudan | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "✓ çözücü doğrudan sorulduğunda yanıt veriyor"

          # --- 4) NRPT kuralını ekle ---
          .\devbox.exe dns install

          # devbox'ın kendi görüşü de sunucuyu göstermeli. Bu satır bir
          # kusuru kilitliyor: Get-DnsClientNrptRule'un NameServers alanı
          # dize değil IPAddress nesnesi geliyor ve eski betikte sessizce
          # boş listeye düşüyordu. Boş bir sunucu listesi kusurun geri
          # geldiği anlamına gelir.
          $durum = .\devbox.exe dns status | Out-String
          Write-Host $durum
          if ($durum -notmatch 'NRPT\s*:\s*\.test\s*→\s*127\.0\.0\.53') {
            throw "devbox dns status NRPT sunucusunu göstermiyor"
          }
          Write-Host "✓ devbox dns status sunucuyu doğru gösteriyor"

          $kural = Get-DnsClientNrptRule | Where-Object { $_.Namespace -contains '.test' }
          if (-not $kural) {
            Get-DnsClientNrptRule | Format-List | Out-String | Write-Host
            throw "NRPT kuralı bulunamadı"
          }
          Write-Host "✓ NRPT kuralı var: $($kural.Namespace) → $($kural.NameServers)"

          Write-Host "--- etkin NRPT ilkesi ---"
          Get-DnsClientNrptPolicy -Effective -ErrorAction SilentlyContinue |
            Format-List | Out-String | Write-Host

          # --- 5) Windows'un kendi çözücüsü NRPT'yi uyguluyor mu? ---
          Clear-DnsClientCache
          $sonuc = Resolve-DnsName -Name magaza.test -ErrorAction SilentlyContinue
          if (-not $sonuc) {
            Get-Content dns-out.log, dns-err.log -ErrorAction SilentlyContinue | Write-Host
            throw "NRPT devrede ama magaza.test çözülemedi"
          }
          $sonuc | Format-Table -AutoSize | Out-String | Write-Host
          $ip = ($sonuc | Where-Object { $_.IPAddress } | Select-Object -First 1).IPAddress
          if ($ip -ne '127.0.0.1') {
            throw "magaza.test $ip adresine çözüldü, 127.0.0.1 bekleniyordu"
          }
          Write-Host "✓ magaza.test → 127.0.0.1 (NRPT üzerinden)"

      # Aynı sebeple tek adım: "devbox up" arka planda başlatılıyor ve
      # adım bitince ölüyor. Başlatan ve sorgulayan her şey birlikte.
      - name: devbox up ve uçtan uca HTTPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Start-Process yolları geçerli konuma göre değil, mutlak
          # verilmeli: aksi halde günlükler deponun dışına düşüyor.
          $kok = (Get-Location).Path
          $siteDizin = Join-Path $kok 'site'
          $devbox = Join-Path $kok 'devbox.exe'
          New-Item -ItemType Directory -Force -Path $siteDizin | Out-Null
          @'
          name: magaza
          domain: magaza.test
          server: proxy
          proxy: http://127.0.0.1:3999
          '@ | Set-Content -Path (Join-Path $siteDizin 'devbox.yaml') -Encoding utf8

          $arka = Start-Process -FilePath .\arka-uc.exe -PassThru `
            -RedirectStandardOutput arka-uc.log -RedirectStandardError arka-uc-err.log
          Start-Sleep -Seconds 2
          if ($arka.HasExited) {
            Get-Content arka-uc.log, arka-uc-err.log -ErrorAction SilentlyContinue | Write-Host
            throw "arka uç açılamadı"
          }

          # Çözücü bu adımda da lazım: NRPT .test'i ona yönlendiriyor.
          $cozucu = Start-Process -FilePath .\devbox.exe -ArgumentList 'dns','serve' -PassThru `
            -RedirectStandardOutput dns2-out.log -RedirectStandardError dns2-err.log
          Start-Sleep -Seconds 2

          $up = Start-Process -FilePath $devbox -WorkingDirectory $siteDizin `
            -ArgumentList 'up','-no-dns' -PassThru `
            -RedirectStandardOutput (Join-Path $kok 'up.log') `
            -RedirectStandardError (Join-Path $kok 'up-err.log')

          $son = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $son) {
            if ((Test-Path up.log) -and (Select-String -Path up.log -Pattern 'hazır: https' -Quiet)) { break }
            if ($up.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          Get-Content up.log, up-err.log -ErrorAction SilentlyContinue | Write-Host
          if (-not (Select-String -Path up.log -Pattern 'hazır: https' -Quiet)) {
            throw "devbox up hazır olmadı"
          }
          Write-Host "✓ devbox up ayakta"

          # --- MVP kabul kriteri: -k OLMADAN HTTPS ---
          # curl.exe Windows'ta Schannel kullanıyor; zincir doğrulaması
          # işletim sisteminin güven deposundan geçiyor.
          $yanit = curl.exe --silent --show-error --fail https://magaza.test/duman 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host $yanit
            throw "https://magaza.test açılamadı (çıkış kodu $LASTEXITCODE)"
          }
          Write-Host "yanıt: $yanit"
          if ($yanit -notmatch 'DEVBOX-DUMAN-TESTI') { throw "beklenen yanıt gelmedi" }
          Write-Host "✓ https://magaza.test — Windows güven zinciriyle, uyarısız"

          # --- HTTP'den HTTPS'e yönlendirme ---
          $kod = curl.exe --silent --output NUL --write-out '%{http_code}' http://magaza.test/
          if ($kod -notmatch '^30[178]$') { throw "HTTP isteği HTTPS'e yönlendirilmedi ($kod)" }
          Write-Host "✓ HTTP → HTTPS yönlendirmesi ($kod)"

          # --- Posta kutusu ve denetleyici ---
          $posta = curl.exe --silent --fail https://mail.magaza.test/api/messages
          if ($LASTEXITCODE -ne 0) { throw "posta kutusu açılamadı" }
          $denet = curl.exe --silent --fail https://inspect.magaza.test/api/state
          if ($LASTEXITCODE -ne 0) { throw "denetleyici açılamadı" }
          Write-Host "denetleyici durumu: $denet"

          $kayitlar = curl.exe --silent --fail https://inspect.magaza.test/api/exchanges | ConvertFrom-Json
          Write-Host "kaydedilen istek sayısı: $($kayitlar.Count)"
          if ($kayitlar.Count -lt 1) { throw "denetleyici hiçbir istek kaydetmemiş" }
          Write-Host "✓ posta kutusu ve denetleyici ayakta"

          # --- SMTP yakalayıcı ---
          $istemci = New-Object Net.Mail.SmtpClient('127.0.0.1', 1025)
          $istemci.Send('uygulama@magaza.test', 'kerim@magaza.test', 'Windows duman testi', 'gövde')
          Start-Sleep -Seconds 1
          $sonPosta = curl.exe --silent --fail https://mail.magaza.test/api/latest | ConvertFrom-Json
          Write-Host "yakalanan konu: $($sonPosta.subject)"
          if ($sonPosta.subject -ne 'Windows duman testi') { throw "posta yakalanmadı" }
          Write-Host "✓ SMTP yakalayıcı çalışıyor"

          # --- İş nesneleri: zorla öldürüldüğünde çocuklar da ölmeli ---
          Stop-Process -Id $up.Id -Force
          Start-Sleep -Seconds 3
          $kalan = Get-Process devbox -ErrorAction SilentlyContinue |
                   Where-Object { $_.Id -ne $cozucu.Id }
          if ($kalan) {
            Write-Host "::warning::zorla öldürmeden sonra kalan süreç: $($kalan.Id -join ', ')"
          } else {
            Write-Host "✓ zorla öldürmede arkada süreç kalmadı"
          }

      - name: Kapanış ve temizlik
        if: always()
        shell: pwsh
        run: |
          Get-Process devbox -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "durduruluyor: pid $($_.Id)"
            $_.CloseMainWindow() | Out-Null
          }
          Start-Sleep -Seconds 3
          Get-Process devbox -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process arka-uc -ErrorAction SilentlyContinue | Stop-Process -Force

          .\devbox.exe dns uninstall
          $kalan = Get-DnsClientNrptRule | Where-Object { $_.Namespace -contains '.test' }
          if ($kalan) { Write-Host "::warning::NRPT kuralı kaldırılamadı" }
          else { Write-Host "✓ NRPT kuralı temizlendi" }

          .\devbox.exe trust uninstall -machine

      - name: Günlükleri yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-duman-gunlukleri
          path: |
            up.log
            up-err.log
            dns-out.log
            dns-err.log
            dns2-out.log
            dns2-err.log
            arka-uc.log
            arka-uc-err.log
          if-no-files-found: ignore
