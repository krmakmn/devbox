        AllowOverride All
        # Yalnız loopback: kenar proxy buradan bağlanıyor, sunucunun
        # yanlışlıkla ağa açılmasını istemiyoruz.
        Require local
    </Directory>

    # Nokta ile başlayan dosyalar sır sızdırır (.env, .git, .htaccess).
